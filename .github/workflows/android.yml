name: Android Legacy Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Install legacy Android SDK
        run: |
          mkdir -p /home/runner/android-sdk
          cd /home/runner/android-sdk

          wget https://dl.google.com/android/repository/tools_r25.2.5-linux.zip
          unzip tools_r25.2.5-linux.zip

          export ANDROID_HOME=/home/runner/android-sdk
          export PATH=$ANDROID_HOME/tools/bin:$PATH

          yes | sdkmanager "platform-tools" "build-tools;23.0.3" "platforms;android-23"

      - name: Write local.properties
        run: |
          echo "sdk.dir=/home/runner/android-sdk" > local.properties

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/**/*.apk
